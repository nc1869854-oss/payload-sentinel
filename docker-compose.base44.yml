services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=development
      # Vite >= 6.1 appends this to its allowed hosts list
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    command: sh -c "bun install --frozen-lockfile && bun run dev -- --port 3000 --host 0.0.0.0"
    restart: unless-stopped

volumes:
  node_modules:
